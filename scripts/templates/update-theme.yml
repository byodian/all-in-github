name: Update theme

on:
  workflow_dispatch:
  schedule:
    # Monthly on day 1 at 10:17 Asia/Shanghai; scheduled runs may be delayed by GitHub.
    - cron: '17 2 1 * *'

permissions:
  contents: read

concurrency:
  group: update-astro-paper
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Prepare the latest AstroPaper release proposal
        id: update-theme
        run: node scripts/update-blog-template.mjs --latest --propose

      - name: Install theme dependencies
        run: pnpm --dir blog install --frozen-lockfile

      - name: Validate updated theme
        run: pnpm --dir blog exec astro check

      - name: Record verified source version
        run: node scripts/update-blog-template.mjs --record-current

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-astro-paper
          delete-branch: true
          commit-message: chore(theme): update AstroPaper source
          title: chore(theme): update AstroPaper source
          body: |
            Monthly proposal for the latest stable AstroPaper release. The exact source ref and commit are pinned in the compatibility registry after validation.

            Review the source version, theme changes, and validation result before merging. This PR does not update site settings or blog content.

      - name: Save candidate changes if validation fails
        id: capture-patch
        if: failure()
        shell: bash
        run: |
          if git diff --quiet; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            git diff --binary > "$RUNNER_TEMP/astro-paper-update.patch"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: failure() && steps.capture-patch.outputs.available == 'true'
        with:
          name: astro-paper-update-patch
          path: ${{ runner.temp }}/astro-paper-update.patch
          if-no-files-found: error
