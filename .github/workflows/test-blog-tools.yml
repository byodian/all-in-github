name: Test blog maintenance tools

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test-blog-tools.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test-blog-tools.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical article names contain colons; test tooling with portable fixtures.
          sparse-checkout: |
            /scripts/
            /package.json
            /pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install maintenance dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test command entry
        run: npm run blog:help

      - name: Test synchronization and platform policy
        run: npm run test:blog-sync
